<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='20260721-03') }}">
  </head>
  <body class="theme-dark">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div>
          <h1>{{ app_name }}</h1>
          <p>v0.1 本地分析台</p>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" type="button" data-view="market-view">
          <span class="nav-icon">⌁</span>
          <span>查看行情</span>
        </button>
        <button class="nav-item" type="button" data-view="database-view">
          <span class="nav-icon">▤</span>
          <span>数据库浏览</span>
        </button>
      </nav>

      <div class="sidebar-actions">
        <button id="theme-toggle" class="sidebar-icon-button" type="button" title="切换夜间模式" aria-label="切换夜间模式">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8z" />
          </svg>
        </button>
        <button id="shutdown-button" class="shutdown-button" type="button">
          <span class="nav-icon">⏻</span>
          <span>退出系统</span>
        </button>
      </div>
    </aside>

    <main class="workspace">
      <div id="shutdown-notice" class="shutdown-notice" hidden>
        <div>
          <h2>系统已退出</h2>
          <p>后端服务已停止。你可以手动关闭这个浏览器页面。</p>
        </div>
      </div>

      <section id="market-view" class="view active">
        <header class="page-header">
          <div>
            <h2>查看行情</h2>
            <p id="market-subtitle">2020年以来行情数据</p>
          </div>
          <form id="symbol-form" class="search-bar">
            <input id="symbol-input" type="text" placeholder="输入代码" autocomplete="off" spellcheck="false" aria-label="股票代码">
            <button type="submit">查询</button>
          </form>
        </header>

        <div id="market-status" class="status neutral">准备就绪</div>
        <section id="market-overview-panel" class="panel overview-panel">
          <div class="panel-title">
            <h3>行情总览</h3>
            <div class="overview-title-actions">
              <label class="switch-control" title="每5分钟刷新总览最新价格">
                <input id="overview-live-toggle" type="checkbox">
                <span class="switch-track" aria-hidden="true"></span>
                <span class="switch-label">自动更新</span>
              </label>
              <span id="overview-summary">加载中</span>
            </div>
          </div>
          <div class="overview-table-wrap">
            <table id="overview-table" class="overview-table"></table>
          </div>
          <div id="overview-pagination" class="overview-pagination" hidden>
            <button id="overview-prev" type="button">上一页</button>
            <span id="overview-page-text">第 1 页 / 共 1 页</span>
            <button id="overview-next" type="button">下一页</button>
          </div>
        </section>

        <section id="market-detail-panel" class="panel chart-panel" hidden>
          <div class="panel-title">
            <div class="detail-title">
              <button id="back-to-overview" class="tool-icon-button" type="button" title="返回总览" aria-label="返回总览">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M19 12H5" />
                  <path d="M12 19l-7-7 7-7" />
                </svg>
              </button>
              <h3 id="chart-title">行情详情</h3>
            </div>
            <div class="chart-actions">
              <div class="period-switch" aria-label="K线周期">
                <button class="period-button active" type="button" data-period="1D">日K</button>
                <button class="period-button" type="button" data-period="3D">3日K</button>
                <button class="period-button" type="button" data-period="1W">周K</button>
                <button class="period-button" type="button" data-period="1M">月K</button>
              </div>
              <button id="indicator-panel-toggle" class="tool-icon-button" type="button" title="指标" aria-label="指标">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 14a8 8 0 0 1 16 0" />
                  <path d="M12 14l4-5" />
                  <path d="M5 18h14" />
                  <path d="M7 14h.01" />
                  <path d="M17 14h.01" />
                </svg>
              </button>
              <button id="update-data-button" class="tool-icon-button" type="button" title="更新数据" aria-label="更新数据">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21 12a9 9 0 0 1-15.2 6.5" />
                  <path d="M3 12A9 9 0 0 1 18.2 5.5" />
                  <path d="M18 2v4h-4" />
                  <path d="M6 22v-4h4" />
                </svg>
              </button>
              <button id="symbol-settings-toggle" class="tool-icon-button" type="button" title="设置" aria-label="设置">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" />
                  <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 0 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8 1.7 1.7 0 0 0 1.5 1h.2a2 2 0 0 1 0 4h-.2a1.7 1.7 0 0 0-1.4 1z" />
                </svg>
              </button>
              <span id="chart-source">等待查询</span>
            </div>
          </div>
          <div id="chart" class="chart">
            <canvas id="kline-canvas" class="kline-canvas"></canvas>
            <div id="indicator-legend" class="indicator-legend"></div>
            <div id="ohlcv-tooltip" class="ohlcv-tooltip" hidden></div>
          </div>
        </section>

        <aside id="indicator-panel" class="indicator-panel" hidden>
          <div class="indicator-panel-header">
            <h3>指标</h3>
            <button id="indicator-panel-close" class="icon-button" type="button" aria-label="关闭指标面板">×</button>
          </div>

          <section class="indicator-section">
            <h4>收藏指标</h4>
            <div id="favorite-indicators" class="favorite-indicators"></div>
          </section>

          <section class="indicator-section">
            <h4>创建指标</h4>
            <form id="custom-indicator-form" class="custom-indicator-form">
              <select id="custom-indicator-type" aria-label="指标类型">
                <option value="MA">MA</option>
                <option value="EMA">EMA</option>
              </select>
              <input id="custom-indicator-period" type="number" min="2" max="500" value="20" aria-label="指标周期">
              <button type="submit">添加</button>
            </form>
          </section>
        </aside>

        <aside id="symbol-settings-panel" class="symbol-settings-panel" hidden>
          <div class="indicator-panel-header">
            <h3>标的设置</h3>
            <button id="symbol-settings-close" class="icon-button" type="button" aria-label="关闭标的设置">×</button>
          </div>
          <label class="setting-row">
            <input id="show-weekend-data" type="checkbox" checked>
            <span>显示周末 K 线</span>
          </label>
        </aside>
      </section>

      <section id="database-view" class="view">
        <header class="page-header">
          <div>
            <h2>数据库浏览</h2>
            <p>查看本地 SQLite 表内容</p>
          </div>
          <div class="db-controls">
            <select id="table-select" aria-label="选择数据表"></select>
            <button id="backup-db" type="button">备份</button>
            <button id="reload-table" type="button">刷新</button>
          </div>
        </header>

        <div id="db-status" class="status neutral">准备就绪</div>

        <section class="panel table-panel">
          <div class="table-toolbar">
            <span id="table-summary">请选择数据表</span>
            <form id="db-search-form" class="db-search">
              <input id="db-search-input" type="search" placeholder="搜索当前表" autocomplete="off">
              <button id="db-search-button" type="submit">搜索</button>
              <button id="db-search-clear" type="button">清空</button>
            </form>
            <div class="pagination">
              <button id="prev-page" type="button">上一页</button>
              <label>
                第
                <input id="page-input" type="number" min="1" value="1">
                页
              </label>
              <span id="page-total">/ 1</span>
              <button id="jump-page" type="button">跳转</button>
              <button id="next-page" type="button">下一页</button>
            </div>
          </div>
          <div class="table-wrap">
            <table id="data-table"></table>
          </div>
        </section>
      </section>
    </main>

    <script src="{{ url_for('static', filename='js/chart.js', v='20260719-03') }}"></script>
    <script src="{{ url_for('static', filename='js/database_browser.js', v='20260719-01') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js', v='20260721-03') }}"></script>
  </body>
</html>
